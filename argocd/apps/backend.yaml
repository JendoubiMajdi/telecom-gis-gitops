apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telecom-backend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: telecom-gis
  source:
    repoURL: https://github.com/JendoubiMajdi/telecom-gis-gitops.git
    targetRevision: main
    path: charts/backend
    helm:
      releaseName: backend
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: telecom-gis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
