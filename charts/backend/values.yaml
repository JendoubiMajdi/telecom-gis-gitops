# The frontend's nginx proxies /api/ to this Service name
fullnameOverride: backend

replicaCount: 1

image:
  repository: docker.io/majdi99/telecom-backend
  # Released by Jenkins: it bumps this value and pushes, Argo CD syncs it
  tag: "2"
  pullPolicy: IfNotPresent

# Only needed for a private registry, e.g. [{ name: regcred }]
imagePullSecrets: []

containerPort: 5000

service:
  type: ClusterIP
  port: 5000

# DATABASE_URL is built from the postgres chart's Secret, so the DB password
# lives in one place. Keep the password free of URL-special characters (@ : / ? #).
database:
  host: postgres
  port: 5432
  existingSecret: postgres-credentials

# Secret created by hand (see README) with keys:
#   JWT_SECRET, EMAIL_USER, EMAIL_PASS, ANTHROPIC_API_KEY (optional)
existingSecret: backend-secrets

# Non-secret settings, rendered into a ConfigMap. Empty values are skipped.
config:
  NODE_ENV: production
  # Used in password-reset email links: the URL users open the frontend on
  FRONTEND_URL: http://localhost:8080
  EMAIL_ENABLED: "true"
  EMAIL_SERVICE: gmail
  EMAIL_FROM: ""
  EMAIL_FROM_NAME: Telcotec
  EXPOSE_DEV_OTP: "false"
  OTP_EXPIRY_MINUTES: "5"
  PASSWORD_RESET_EXPIRY_MINUTES: "15"
  MAX_LOGIN_ATTEMPTS: "5"
  ACCOUNT_LOCKOUT_MINUTES: "15"
  ANTHROPIC_MODEL: ""

# Holds the pod in Init until Postgres accepts TCP connections
waitForDatabase:
  enabled: true
  image: busybox:1.36

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
