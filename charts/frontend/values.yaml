fullnameOverride: frontend

replicaCount: 1

image:
  # Built with REACT_APP_API_URL=/api (the Dockerfile default)
  repository: docker.io/majdi99/telecom-frontend
  # Released by Jenkins: it bumps this value and pushes, Argo CD syncs it
  tag: "1.0.1"
  pullPolicy: IfNotPresent

# Only needed for a private registry, e.g. [{ name: regcred }]
imagePullSecrets: []

service:
  # NodePort so it is reachable from the host on minikube without an ingress
  type: NodePort
  port: 80
  nodePort: 30080

# Where nginx proxies /api/ to (the backend chart's Service)
backend:
  host: backend
  port: 5000

# nginx resolves the backend through cluster DNS at request time, so the
# frontend starts fine even if the backend Service does not exist yet
nginx:
  resolver: kube-dns.kube-system.svc.cluster.local
  clusterDomain: cluster.local

ingress:
  enabled: false
  # minikube: `minikube addons enable ingress`
  className: nginx
  host: telecom-gis.local
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
